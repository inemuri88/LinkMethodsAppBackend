spring.application.name=linkmethod

server.port=8082


spring.datasource.url=jdbc:mysql://localhost:3306/linkmethod?characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Europe/Rome
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.open-in-view=false           
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.connection-timeout=30000   
spring.datasource.hikari.validation-timeout=5000    


logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

